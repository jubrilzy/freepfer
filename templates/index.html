<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePfer — PDF Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand: #0A0F1E;
  --accent: #2563EB;
  --bg: #F1F5F9;
  --panel: #FFFFFF;
  --border: #E2E8F0;
  --text: #0F172A;
  --muted: #64748B;
  --success: #16A34A;
  --warn: #D97706;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- TOPBAR ---- */
.topbar {
  background: var(--brand);
  height: 50px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
  user-select: none;
}
.logo {
  font-size: 1.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, #60A5FA, #A78BFA);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-right: 4px;
}
.btn {
  padding: 6px 14px;
  border-radius: 7px;
  border: none;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #1D4ED8; }
.btn-ghost { background: rgba(255,255,255,0.09); color: #CBD5E1; border: 1px solid rgba(255,255,255,0.1); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
.sep { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 2px; }

/* Word-style format bar (shown when span selected) */
.format-bar {
  display: none;
  align-items: center;
  gap: 6px;
  margin-left: 8px;
  padding-left: 8px;
  border-left: 1px solid rgba(255,255,255,0.12);
}
.format-bar.show { display: flex; }

.font-select-wrap {
  position: relative;
}
#font-search {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: #fff;
  font-size: 0.82rem;
  padding: 4px 8px;
  width: 180px;
  outline: none;
}
#font-search::placeholder { color: rgba(255,255,255,0.4); }
#font-search:focus { border-color: #60A5FA; }

.font-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 240px;
  background: #1E293B;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  max-height: 280px;
  overflow-y: auto;
  z-index: 1000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.font-dropdown.open { display: block; }
.font-opt {
  padding: 8px 12px;
  cursor: pointer;
  font-size: 0.85rem;
  color: #CBD5E1;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  gap: 8px;
}
.font-opt:hover { background: rgba(37,99,235,0.3); color: #fff; }
.font-opt.active { color: #60A5FA; }
.font-preview-label { font-size: 0.95rem; }

.size-display {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  color: #fff;
  font-size: 0.82rem;
  padding: 4px 8px;
  width: 50px;
  text-align: center;
}

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.status-pill {
  font-size: 0.72rem;
  color: #94A3B8;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 3px 10px;
}

/* ---- PAGE NAV BAR ---- */
.page-bar {
  display: none;
  background: #1E293B;
  height: 38px;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.page-bar.show { display: flex; }
.page-bar button {
  background: rgba(255,255,255,0.08);
  border: none;
  color: #CBD5E1;
  font-size: 0.9rem;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
}
.page-bar button:disabled { opacity: 0.3; cursor: default; }
.page-bar button:not(:disabled):hover { background: rgba(255,255,255,0.15); }
.page-label { color: #94A3B8; font-size: 0.82rem; min-width: 80px; text-align: center; }

/* ---- MAIN ---- */
.main { flex: 1; overflow: hidden; display: flex; }

/* DROP ZONE */
#drop-zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.drop-card {
  background: var(--panel);
  border: 2px dashed var(--border);
  border-radius: 20px;
  padding: 3rem 4rem;
  text-align: center;
  max-width: 440px;
  width: 90%;
  transition: border-color .2s, background .2s;
}
.drop-card:hover, .drop-card.drag-over {
  border-color: var(--accent);
  background: #EFF6FF;
}
.drop-icon { font-size: 2.8rem; margin-bottom: 1rem; }
.drop-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; }
.drop-sub { color: var(--muted); font-size: 0.88rem; }
.drop-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.6rem; }

/* VIEWER */
#viewer {
  display: none;
  flex: 1;
  overflow: auto;
  background: #334155;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
}
#viewer.show { display: flex; }

.pdf-wrap {
  position: relative;
  display: inline-block;
  line-height: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border-radius: 2px;
}
#pdf-img { display: block; max-width: 100%; height: auto; }
#overlay { position: absolute; inset: 0; }

/* Span hover boxes */
.span-box {
  position: absolute;
  cursor: text;
  border: 1.5px solid transparent;
  border-radius: 2px;
  transition: border-color .1s, background .1s;
}
.span-box:hover { border-color: rgba(37,99,235,0.5); background: rgba(37,99,235,0.07); }
.span-box.editing { border-color: var(--accent) !important; background: transparent !important; }

/* Inline edit input — positioned over the span */
#inline-input {
  display: none;
  position: absolute;
  z-index: 100;
  border: 2px solid var(--accent);
  border-radius: 3px;
  outline: none;
  background: rgba(255,255,255,0.97);
  color: #000;
  padding: 1px 3px;
  line-height: 1.2;
  min-width: 60px;
  box-shadow: 0 4px 20px rgba(37,99,235,0.3);
}
#inline-input.show { display: block; }

/* Floating apply bar */
#apply-bar {
  display: none;
  position: absolute;
  z-index: 101;
  background: #1E293B;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 5px 8px;
  gap: 6px;
  align-items: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  white-space: nowrap;
}
#apply-bar.show { display: flex; }
#apply-bar .ab-btn {
  padding: 4px 10px;
  border-radius: 5px;
  border: none;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
}
.ab-apply { background: var(--accent); color: #fff; }
.ab-apply:hover { background: #1D4ED8; }
.ab-cancel { background: rgba(255,255,255,0.08); color: #94A3B8; }
.ab-cancel:hover { background: rgba(255,255,255,0.15); color: #fff; }
#apply-status {
  font-size: 0.72rem;
  color: #94A3B8;
  min-width: 80px;
}

/* Loading overlay */
#loading {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,15,30,0.65);
  z-index: 999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
  color: #fff;
  backdrop-filter: blur(3px);
}
#loading.show { display: flex; }
.ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #2563EB;
  border-right-color: #7C3AED;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#file-input { display: none; }
</style>
</head>
<body>

<div id="loading"><div class="ring"></div><span id="loading-text">Processing…</span></div>
<input type="file" id="file-input" accept=".pdf">

<!-- TOPBAR -->
<div class="topbar">
  <span class="logo">FreePfer</span>
  <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">Open PDF</button>
  <button class="btn btn-ghost" id="btn-download" disabled onclick="downloadPDF()">⬇ Download</button>

  <div class="sep"></div>

  <!-- Format bar (MS Word style — shown when span is active) -->
  <div class="format-bar" id="format-bar">
    <div class="font-select-wrap">
      <input id="font-search" type="text" placeholder="Font…" autocomplete="off"
             oninput="filterFonts(this.value)" onfocus="openFontDrop()" onclick="openFontDrop()">
      <div class="font-dropdown" id="font-dropdown"></div>
    </div>
    <input class="size-display" id="size-display" type="text" readonly title="Font size">
  </div>

  <div class="topbar-right">
    <span class="status-pill" id="status-pill">Ready</span>
  </div>
</div>

<!-- PAGE NAV -->
<div class="page-bar" id="page-bar">
  <button id="btn-prev" onclick="changePage(-1)">◀</button>
  <span class="page-label" id="page-label">Page 1 of 1</span>
  <button id="btn-next" onclick="changePage(1)">▶</button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- Drop zone -->
  <div id="drop-zone">
    <div class="drop-card" id="drop-card">
      <div class="drop-icon">📄</div>
      <div class="drop-title">Drop your PDF here</div>
      <div class="drop-sub">or click <strong>Open PDF</strong> above</div>
      <div class="drop-hint">Click any text to edit · Google Fonts · Free</div>
    </div>
  </div>

  <!-- Viewer -->
  <div id="viewer">
    <div class="pdf-wrap" id="pdf-wrap">
      <img id="pdf-img" src="" alt="PDF page">
      <div id="overlay">
        <!-- inline input sits inside overlay, positioned absolutely -->
        <input id="inline-input" type="text" spellcheck="false">
        <div id="apply-bar">
          <button class="ab-btn ab-apply" onclick="applyEdit()">✓ Apply</button>
          <button class="ab-btn ab-cancel" onclick="cancelEdit()">✗</button>
          <span id="apply-status"></span>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ------------------------------------------------------------------ //
//  Google Fonts list (~100 popular)                                   //
// ------------------------------------------------------------------ //
const GFONTS = [
  "Roboto","Open Sans","Lato","Montserrat","Oswald","Raleway","Poppins",
  "Merriweather","Playfair Display","Ubuntu","PT Sans","Nunito","Source Sans Pro",
  "Libre Baskerville","Noto Sans","Noto Serif","Inter","Crimson Text",
  "Josefin Sans","Dosis","Quicksand","Cabin","Exo 2","Karla","Muli",
  "Work Sans","Rubik","Fira Sans","Heebo","Barlow","Titillium Web",
  "Comfortaa","Zilla Slab","IBM Plex Sans","IBM Plex Serif","DM Sans",
  "DM Serif Display","Space Grotesk","Space Mono","Manrope","Outfit",
  "Plus Jakarta Sans","Lexend","Archivo","Jost","Figtree","Syne",
  "Cormorant Garamond","EB Garamond","Libre Caslon Text","Bodoni Moda",
  "Spectral","Lora","Bitter","Arimo","Tinos","Cousine",
  "Inconsolata","Source Code Pro","JetBrains Mono","Fira Code","Courier Prime",
  "PT Mono","Roboto Mono","DM Mono","Overpass Mono","Anonymous Pro",
  "Pacifico","Dancing Script","Lobster","Great Vibes","Satisfy","Courgette",
  "Sacramento","Parisienne","Italianno","Allura",
  "Anton","Black Han Sans","Passion One","Staatliches","Alfa Slab One",
  "Fjalla One","Changa One","Graduate","Orbitron","Exo",
  "Noto Sans JP","Noto Sans KR","Noto Sans TC","Noto Sans SC",
  "Cairo","Tajawal","Amiri","Scheherazade New",
  "Roboto Condensed","Open Sans Condensed","Barlow Condensed",
];

// Pre-load Google Fonts CSS for previews
const loadedFonts = new Set();
function ensureFontLoaded(family) {
  if (loadedFonts.has(family)) return;
  loadedFonts.add(family);
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = `https://fonts.googleapis.com/css2?family=${family.replace(/ /g,"+")}&display=swap`;
  document.head.appendChild(link);
}

// ------------------------------------------------------------------ //
//  State                                                               //
// ------------------------------------------------------------------ //
let sessionId    = null;
let pageCount    = 1;
let currentPage  = 0;
let allSpans     = [];
let activeSpan   = null;
let activeIdx    = -1;
let selectedFont = null; // Google Font override, or null = use PDF native
const ZOOM       = 1.5;

// ------------------------------------------------------------------ //
//  UI helpers                                                          //
// ------------------------------------------------------------------ //
function showLoading(msg) {
  document.getElementById("loading-text").textContent = msg || "Processing…";
  document.getElementById("loading").classList.add("show");
}
function hideLoading() { document.getElementById("loading").classList.remove("show"); }
function setStatus(msg, color) {
  const p = document.getElementById("status-pill");
  p.textContent = msg;
  p.style.color = color || "#94A3B8";
}

// ------------------------------------------------------------------ //
//  Font dropdown                                                       //
// ------------------------------------------------------------------ //
let filteredFonts = [...GFONTS];

function buildFontDrop(list) {
  const dd = document.getElementById("font-dropdown");
  dd.innerHTML = "";
  list.slice(0, 60).forEach(f => {
    ensureFontLoaded(f);
    const div = document.createElement("div");
    div.className = "font-opt" + (f === selectedFont ? " active" : "");
    div.dataset.font = f;
    div.innerHTML = `<span class="font-preview-label" style="font-family:'${f}',sans-serif">${f}</span>`;
    div.addEventListener("mousedown", e => { e.preventDefault(); pickFont(f); });
    dd.appendChild(div);
  });
}

function openFontDrop() {
  filteredFonts = [...GFONTS];
  buildFontDrop(filteredFonts);
  document.getElementById("font-dropdown").classList.add("open");
}

function closeFontDrop() {
  document.getElementById("font-dropdown").classList.remove("open");
}

function filterFonts(q) {
  if (!q) { filteredFonts = [...GFONTS]; }
  else { filteredFonts = GFONTS.filter(f => f.toLowerCase().includes(q.toLowerCase())); }
  buildFontDrop(filteredFonts);
  document.getElementById("font-dropdown").classList.add("open");
}

function pickFont(family) {
  selectedFont = family;
  document.getElementById("font-search").value = family;
  closeFontDrop();
  ensureFontLoaded(family);
  // Apply preview to inline input
  if (document.getElementById("inline-input").classList.contains("show")) {
    document.getElementById("inline-input").style.fontFamily = `'${family}', sans-serif`;
  }
}

document.addEventListener("click", e => {
  if (!e.target.closest(".font-select-wrap")) closeFontDrop();
});

// ------------------------------------------------------------------ //
//  File upload                                                         //
// ------------------------------------------------------------------ //
document.getElementById("file-input").addEventListener("change", e => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
});
document.body.addEventListener("dragover", e => {
  e.preventDefault();
  document.getElementById("drop-card").classList.add("drag-over");
});
document.body.addEventListener("dragleave", () =>
  document.getElementById("drop-card").classList.remove("drag-over"));
document.body.addEventListener("drop", e => {
  e.preventDefault();
  document.getElementById("drop-card").classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (file?.name.endsWith(".pdf")) uploadFile(file);
});

async function uploadFile(file) {
  showLoading("Uploading PDF…");
  const fd = new FormData();
  fd.append("file", file);
  try {
    const r = await fetch("/upload", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) { alert(data.error || "Upload failed"); hideLoading(); return; }
    sessionId   = data.session_id;
    pageCount   = data.page_count;
    currentPage = 0;
    document.getElementById("drop-zone").style.display = "none";
    document.getElementById("viewer").classList.add("show");
    document.getElementById("page-bar").classList.add("show");
    document.getElementById("btn-download").disabled = false;
    renderPage(data.page_image, data.spans);
    hideLoading();
    setStatus("Click any text to edit");
  } catch(e) { alert("Error: " + e.message); hideLoading(); }
}

// ------------------------------------------------------------------ //
//  Page rendering                                                      //
// ------------------------------------------------------------------ //
function renderPage(b64, spans) {
  cancelEdit();
  const img = document.getElementById("pdf-img");
  img.src = "data:image/png;base64," + b64;
  allSpans = spans;
  img.onload = () => drawSpanBoxes();
  if (img.complete) drawSpanBoxes();

  document.getElementById("page-label").textContent = `Page ${currentPage+1} of ${pageCount}`;
  document.getElementById("btn-prev").disabled = currentPage === 0;
  document.getElementById("btn-next").disabled = currentPage === pageCount - 1;
}

function drawSpanBoxes() {
  // Remove old boxes (keep inline-input and apply-bar)
  document.querySelectorAll(".span-box").forEach(el => el.remove());

  const img = document.getElementById("pdf-img");
  const overlay = document.getElementById("overlay");
  const scaleX = img.clientWidth  / img.naturalWidth;
  const scaleY = img.clientHeight / img.naturalHeight;

  allSpans.forEach((span, idx) => {
    const [x0, y0, x1, y1] = span.bbox;
    const div = document.createElement("div");
    div.className = "span-box";
    div.style.left   = (x0 * ZOOM * scaleX) + "px";
    div.style.top    = (y0 * ZOOM * scaleY) + "px";
    div.style.width  = ((x1 - x0) * ZOOM * scaleX) + "px";
    div.style.height = ((y1 - y0) * ZOOM * scaleY) + "px";
    div.dataset.idx  = idx;
    div.title        = span.text;
    div.addEventListener("click", () => activateSpan(idx));
    overlay.appendChild(div);
  });
}

window.addEventListener("resize", () => { if (allSpans.length) drawSpanBoxes(); });

// ------------------------------------------------------------------ //
//  Page navigation                                                     //
// ------------------------------------------------------------------ //
async function changePage(delta) {
  const next = currentPage + delta;
  if (next < 0 || next >= pageCount) return;
  showLoading("Loading page…");
  const r = await fetch(`/page/${sessionId}/${next}`);
  const data = await r.json();
  currentPage = next;
  renderPage(data.page_image, data.spans);
  hideLoading();
}

// ------------------------------------------------------------------ //
//  Inline editing                                                      //
// ------------------------------------------------------------------ //
function activateSpan(idx) {
  cancelEdit();
  activeSpan = allSpans[idx];
  activeIdx  = idx;

  const img    = document.getElementById("pdf-img");
  const scaleX = img.clientWidth  / img.naturalWidth;
  const scaleY = img.clientHeight / img.naturalHeight;
  const [x0, y0, x1, y1] = activeSpan.bbox;

  const left   = x0 * ZOOM * scaleX;
  const top    = y0 * ZOOM * scaleY;
  const width  = Math.max((x1 - x0) * ZOOM * scaleX, 60);
  const height = (y1 - y0) * ZOOM * scaleY;
  const fontSize = activeSpan.size * ZOOM * scaleY;

  // Mark the span box
  document.querySelectorAll(".span-box").forEach(el => el.classList.remove("editing"));
  const box = document.querySelector(`.span-box[data-idx="${idx}"]`);
  if (box) box.classList.add("editing");

  // Position inline input over the span
  const inp = document.getElementById("inline-input");
  inp.style.left      = left + "px";
  inp.style.top       = top + "px";
  inp.style.width     = (width + 20) + "px";
  inp.style.height    = height + "px";
  inp.style.fontSize  = fontSize + "px";
  inp.style.fontFamily = selectedFont
    ? `'${selectedFont}', sans-serif`
    : `'${activeSpan.font}', sans-serif`;
  inp.value = activeSpan.text;
  inp.classList.add("show");
  inp.focus();
  inp.select();

  // Show format bar
  document.getElementById("format-bar").classList.add("show");
  document.getElementById("font-search").value = selectedFont || activeSpan.font;
  document.getElementById("size-display").value = activeSpan.size + " pt";

  // Position apply bar below the span
  const bar = document.getElementById("apply-bar");
  bar.style.left = left + "px";
  bar.style.top  = (top + height + 4) + "px";
  bar.classList.add("show");
  document.getElementById("apply-status").textContent = "";
}

function cancelEdit() {
  document.getElementById("inline-input").classList.remove("show");
  document.getElementById("apply-bar").classList.remove("show");
  document.querySelectorAll(".span-box").forEach(el => el.classList.remove("editing"));
  document.getElementById("format-bar").classList.remove("show");
  activeSpan = null;
  activeIdx  = -1;
}

async function applyEdit() {
  if (!activeSpan) return;
  const newText = document.getElementById("inline-input").value.trim();
  if (!newText) return;

  document.getElementById("apply-status").textContent = "Saving…";
  document.getElementById("apply-bar").querySelector(".ab-apply").disabled = true;

  try {
    const body = {
      session_id: sessionId,
      page:       currentPage,
      bbox:       activeSpan.bbox,
      new_text:   newText,
      font:       activeSpan.font,
    };
    if (selectedFont) body.gfont = selectedFont;

    const r    = await fetch("/edit", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const data = await r.json();

    if (data.success) {
      setStatus(data.font_preserved ? "✓ Font preserved" : `⚠ Fallback: ${data.font_used?.split("/").pop()}`, data.font_preserved ? "var(--success)" : "var(--warn)");
      renderPage(data.page_image, data.spans);
    } else {
      document.getElementById("apply-status").textContent = "✗ Failed";
      setStatus("Edit failed", "#DC2626");
    }
  } catch(e) {
    document.getElementById("apply-status").textContent = "✗ Error";
  }

  document.getElementById("apply-bar").querySelector(".ab-apply").disabled = false;
}

// Keyboard shortcuts on inline input
document.getElementById("inline-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); applyEdit(); }
  if (e.key === "Escape") cancelEdit();
});

// Click outside overlay to cancel
document.getElementById("pdf-img").addEventListener("click", () => cancelEdit());

// ------------------------------------------------------------------ //
//  Download                                                            //
// ------------------------------------------------------------------ //
function downloadPDF() {
  if (sessionId) window.location.href = `/download/${sessionId}`;
}
</script>
</body>
</html>
