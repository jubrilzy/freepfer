<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePfer — PDF Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f0f0;--paper:#fff;--toolbar:#2b2b2b;--ribbon:#3c3c3c;
  --accent:#1a73e8;--border:#d0d0d0;--border-dark:#999;
  --text:#1a1a1a;--muted:#666;
  --success:#1a7340;--warn:#a16207;--danger:#b91c1c;
  --radius:4px;--span-hover:rgba(26,115,232,0.08);--span-focus:rgba(26,115,232,0.14);
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px;}

/* ══ MENU BAR ══ */
.menubar{background:var(--toolbar);height:38px;display:flex;align-items:center;padding:0 14px;gap:4px;flex-shrink:0;}
.logo{font-size:14px;font-weight:700;color:#fff;margin-right:10px;letter-spacing:-.3px;cursor:default;}
.logo span{color:#5ba3f5;}
.m-btn{height:26px;padding:0 12px;background:transparent;border:none;color:rgba(255,255,255,.75);font-size:12px;border-radius:3px;cursor:pointer;font-family:inherit;}
.m-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.m-sep{width:1px;height:16px;background:rgba(255,255,255,.15);margin:0 4px;}
.m-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.m-save{background:var(--accent);color:#fff;border:none;height:28px;padding:0 14px;border-radius:var(--radius);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;gap:6px;}
.m-save:disabled{opacity:.35;cursor:not-allowed;}
.m-save:not(:disabled):hover{background:#1557b0;}
.m-open{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);height:28px;padding:0 14px;border-radius:var(--radius);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;}
.m-open:hover{background:rgba(255,255,255,.18);}

/* ══ RIBBON ══ */
.ribbon{background:var(--ribbon);border-bottom:1px solid #1a1a1a;height:42px;display:flex;align-items:center;padding:0 12px;gap:4px;flex-shrink:0;user-select:none;overflow-x:auto;}
.ribbon::-webkit-scrollbar{height:0;}
.rb-group{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid rgba(255,255,255,.1);}
.rb-group:last-child{border-right:none;}

.rb-btn{width:30px;height:28px;background:transparent;border:1px solid transparent;border-radius:3px;color:rgba(255,255,255,.75);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:inherit;transition:.12s;}
.rb-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#fff;}
.rb-btn.active{background:rgba(26,115,232,.35);border-color:rgba(26,115,232,.6);color:#5ba3f5;}
.rb-btn[disabled]{opacity:.3;cursor:not-allowed;}

/* Font dropdown */
.rb-select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);color:#fff;font-size:12px;font-family:inherit;padding:4px 8px;height:28px;outline:none;cursor:pointer;}
.rb-select:hover{background:rgba(255,255,255,.12);}
.rb-select option{background:#3c3c3c;color:#fff;}

/* Font search */
.font-wrap{position:relative;}
#font-search{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);color:#fff;font-size:12px;font-family:inherit;padding:4px 8px;width:155px;height:28px;outline:none;}
#font-search:focus{background:rgba(255,255,255,.12);border-color:rgba(26,115,232,.8);}
#font-search::placeholder{color:rgba(255,255,255,.35);}
.font-dd{display:none;position:absolute;top:calc(100% + 3px);left:0;width:220px;background:#2b2b2b;border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);max-height:300px;overflow-y:auto;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.7);}
.font-dd.open{display:block;}
.font-opt{padding:7px 12px;cursor:pointer;font-size:13px;color:#ccc;border-bottom:1px solid rgba(255,255,255,.04);}
.font-opt:hover,.font-opt.active{background:rgba(26,115,232,.25);color:#fff;}

/* Size input */
#size-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);color:#fff;font-size:12px;font-family:inherit;padding:4px 6px;width:46px;height:28px;text-align:center;outline:none;}
#size-input:focus{border-color:rgba(26,115,232,.8);}

/* Color picker wrapper */
.color-wrap{position:relative;width:30px;height:28px;}
.color-wrap input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;}
.color-preview{pointer-events:none;width:30px;height:28px;border-radius:3px;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:14px;flex-direction:column;gap:0;}
.color-bar{width:16px;height:3px;border-radius:1px;margin-top:1px;}

/* Page nav */
.page-nav{display:none;background:#e8e8e8;border-bottom:1px solid var(--border);height:30px;align-items:center;justify-content:center;gap:10px;flex-shrink:0;}
.page-nav.show{display:flex;}
.pn-btn{background:#fff;border:1px solid var(--border);color:var(--muted);padding:2px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;}
.pn-btn:disabled{opacity:.3;cursor:default;}
.pn-btn:not(:disabled):hover{background:#f0f0f0;}
#page-label{font-size:12px;color:var(--muted);min-width:90px;text-align:center;}

/* ══ MAIN ══ */
.main{flex:1;overflow:hidden;display:flex;}

/* ══ DROP ══ */
#drop-zone{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.drop-card{background:#fff;border:2px dashed var(--border);border-radius:12px;padding:3.5rem 4rem;text-align:center;max-width:460px;width:92%;box-shadow:0 2px 16px rgba(0,0,0,.08);transition:.2s;}
.drop-card:hover,.drop-card.drag-over{border-color:var(--accent);background:#f0f6ff;}
.drop-icon{font-size:3rem;margin-bottom:1.2rem;line-height:1;}
.drop-title{font-size:1.3rem;font-weight:700;margin-bottom:.4rem;color:#1a1a1a;}
.drop-sub{color:var(--muted);font-size:13px;margin-bottom:1.4rem;}
.drop-cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:var(--radius);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(26,115,232,.3);}
.drop-cta:hover{background:#1557b0;}
.drop-hint{font-size:11.5px;color:#aaa;margin-top:1.2rem;line-height:1.9;}

/* ══ VIEWER ══ */
#viewer{display:none;flex:1;overflow:auto;background:var(--bg);justify-content:center;padding:28px 20px;}
#viewer.show{display:flex;}
.pdf-wrap{position:relative;display:inline-block;line-height:0;box-shadow:0 4px 24px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.08);border-radius:1px;flex-shrink:0;}
#pdf-img{display:block;max-width:100%;height:auto;}

/* ══ TEXT OVERLAY ══ */
#text-layer{position:absolute;inset:0;pointer-events:none;}
.span-el{position:absolute;cursor:text;border:1px solid transparent;border-radius:1px;white-space:pre;overflow:visible;line-height:1.2;background:transparent;transition:border-color .1s,background .1s;}
.span-el:hover{border-color:rgba(26,115,232,.35);background:var(--span-hover);}
.span-el.editing{border-color:var(--accent) !important;background:var(--span-focus) !important;outline:none;cursor:text;}
/* show pointer on non-editing */
.span-el:not(.editing){pointer-events:all;}

/* ══ IMAGE LAYER ══ */
#img-layer{position:absolute;inset:0;pointer-events:none;}
.img-box{position:absolute;cursor:move;border:2px solid transparent;border-radius:1px;transition:.12s;}
.img-box:hover{border-color:rgba(234,179,8,.7);}
.img-box.selected{border-color:#eab308;box-shadow:0 0 0 1px rgba(234,179,8,.3);}
.img-box.dragging{opacity:.4;border-style:dashed;}
.img-badge{position:absolute;top:-16px;left:0;background:#eab308;color:#000;font-size:9px;font-weight:700;padding:1px 5px;border-radius:2px 2px 0 0;letter-spacing:.5px;pointer-events:none;}
.rh{position:absolute;width:8px;height:8px;background:#eab308;border:1.5px solid #fff;border-radius:1px;z-index:10;pointer-events:all;}
.rh-tl{top:-4px;left:-4px;cursor:nw-resize;}
.rh-tr{top:-4px;right:-4px;cursor:ne-resize;}
.rh-bl{bottom:-4px;left:-4px;cursor:sw-resize;}
.rh-br{bottom:-4px;right:-4px;cursor:se-resize;}

/* ══ IMG CONTEXT MENU ══ */
#img-ctx{display:none;position:absolute;z-index:200;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:4px;box-shadow:0 4px 20px rgba(0,0,0,.18);gap:3px;}
#img-ctx.show{display:flex;}
.ic-btn{padding:5px 11px;border-radius:3px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;}
.ic-replace{background:#fefce8;color:#a16207;border:1px solid #fde68a;}
.ic-replace:hover{background:#fef3c7;}
.ic-delete{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;}
.ic-delete:hover{background:#fee2e2;}
.ic-cancel{background:#f8fafc;color:var(--muted);border:1px solid var(--border);}
.ic-cancel:hover{background:#f1f5f9;}

/* Drag ghost */
#drag-ghost{display:none;position:absolute;z-index:60;border:2px dashed #1a73e8;border-radius:2px;pointer-events:none;background:rgba(26,115,232,.06);}
#drag-ghost.img{border-color:#eab308;background:rgba(234,179,8,.06);}

/* ══ STATUS BAR ══ */
.statusbar{background:#2b2b2b;border-top:1px solid #1a1a1a;height:24px;display:flex;align-items:center;padding:0 14px;gap:14px;flex-shrink:0;}
.sb{font-size:11px;color:rgba(255,255,255,.45);}
.sb.ok{color:rgba(100,200,120,.8);}
.sb.warn{color:rgba(250,180,60,.8);}
.sb-r{margin-left:auto;}

/* Loading */
#loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(2px);}
#loading.show{display:flex;}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin .8s linear infinite;}
#loading-text{font-size:13px;color:#ccc;}
@keyframes spin{to{transform:rotate(360deg)}}
#file-input{display:none;}
#img-replace-input{display:none;}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><span id="loading-text">Processing…</span></div>
<input type="file" id="file-input" accept=".pdf">
<input type="file" id="img-replace-input" accept="image/*">

<!-- MENU BAR -->
<div class="menubar">
  <span class="logo">Free<span>Pfer</span></span>
  <button class="m-open" onclick="document.getElementById('file-input').click()">Open</button>
  <div class="m-sep"></div>
  <div class="m-right">
    <span id="file-name-label" style="font-size:11.5px;color:rgba(255,255,255,.4);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    <button class="m-save" id="btn-save" disabled onclick="downloadPDF()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PDF
    </button>
  </div>
</div>

<!-- RIBBON (always visible, like Word) -->
<div class="ribbon" id="ribbon">
  <!-- Font family -->
  <div class="rb-group">
    <div class="font-wrap">
      <input id="font-search" type="text" placeholder="Font…" autocomplete="off"
             oninput="filterFonts(this.value)" onfocus="openDD()" onclick="openDD()">
      <div class="font-dd" id="font-dd"></div>
    </div>
  </div>
  <!-- Size -->
  <div class="rb-group">
    <input id="size-input" type="number" min="4" max="200" value="12" title="Font size">
  </div>
  <!-- Style -->
  <div class="rb-group">
    <button class="rb-btn" id="btn-bold"      title="Bold (Ctrl+B)"      onclick="fmt('bold')"><b>B</b></button>
    <button class="rb-btn" id="btn-italic"    title="Italic (Ctrl+I)"    onclick="fmt('italic')"><i>I</i></button>
    <button class="rb-btn" id="btn-underline" title="Underline (Ctrl+U)" onclick="fmt('underline')"><u>U</u></button>
  </div>
  <!-- Color -->
  <div class="rb-group">
    <label class="color-wrap" title="Text color">
      <input type="color" id="color-pick" value="#000000" oninput="updateColorBar()">
      <div class="color-preview">
        <span style="font-size:13px;font-weight:700;color:#fff;">A</span>
        <div class="color-bar" id="color-bar" style="background:#000"></div>
      </div>
    </label>
  </div>
  <!-- Align -->
  <div class="rb-group">
    <button class="rb-btn" title="Align left"   onclick="setAlign('left')">≡</button>
    <button class="rb-btn" title="Align center" onclick="setAlign('center')">⬛</button>
    <button class="rb-btn" title="Align right"  onclick="setAlign('right')">▶</button>
  </div>
  <!-- Apply -->
  <div class="rb-group">
    <button class="rb-btn" id="btn-apply" title="Apply changes (Enter)" disabled
            onclick="applyEdit()" style="width:auto;padding:0 12px;background:rgba(26,115,232,.2);border-color:rgba(26,115,232,.4);color:#5ba3f5;font-size:12px;font-weight:600;">
      ✓ Apply
    </button>
    <button class="rb-btn" id="btn-cancel" title="Cancel (Esc)" disabled
            onclick="cancelEdit()" style="width:auto;padding:0 10px;font-size:12px;">
      ✗
    </button>
  </div>
  <!-- Page nav (right side) -->
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;" id="page-controls">
    <button class="rb-btn" id="btn-prev" disabled onclick="changePage(-1)" style="width:auto;padding:0 8px;">◀</button>
    <span id="page-label" style="font-size:11px;color:rgba(255,255,255,.5);min-width:80px;text-align:center;">No file</span>
    <button class="rb-btn" id="btn-next" disabled onclick="changePage(1)" style="width:auto;padding:0 8px;">▶</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="drop-zone">
    <div class="drop-card" id="drop-card">
      <div class="drop-icon">📄</div>
      <div class="drop-title">Open a PDF to edit</div>
      <div class="drop-sub">Drop a file here, or click the button</div>
      <button class="drop-cta" onclick="document.getElementById('file-input').click()">Choose PDF</button>
      <div class="drop-hint">
        Click any text to edit it directly<br>
        Use the toolbar above: font, size, bold, italic, underline, color<br>
        Images auto-detected — drag, resize or replace
      </div>
    </div>
  </div>

  <div id="viewer">
    <div class="pdf-wrap" id="pdf-wrap">
      <img id="pdf-img" src="" alt="">
      <!-- Text spans overlaid directly on PDF -->
      <div id="text-layer"></div>
      <!-- Image boxes -->
      <div id="img-layer">
        <div id="img-ctx"></div>
        <div id="drag-ghost"></div>
      </div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <span class="sb" id="sb-status">Ready</span>
  <span class="sb" id="sb-info"></span>
  <span class="sb sb-r" id="sb-pos"></span>
</div>

<script>
// ------------------------------------------------------------------ //
//  Google Fonts                                                        //
// ------------------------------------------------------------------ //
const GFONTS = ["Roboto","Open Sans","Lato","Montserrat","Oswald","Raleway","Poppins",
 "Merriweather","Playfair Display","Ubuntu","PT Sans","Nunito","Source Sans Pro",
 "Libre Baskerville","Noto Sans","Noto Serif","Inter","Crimson Text","Josefin Sans",
 "Dosis","Quicksand","Cabin","Exo 2","Karla","Work Sans","Rubik","Fira Sans","Heebo",
 "Barlow","Titillium Web","Comfortaa","Zilla Slab","IBM Plex Sans","IBM Plex Serif",
 "DM Sans","DM Serif Display","Space Grotesk","Manrope","Outfit","Plus Jakarta Sans",
 "Lexend","Archivo","Jost","Figtree","Syne","Cormorant Garamond","EB Garamond",
 "Libre Caslon Text","Bodoni Moda","Spectral","Lora","Bitter","Arimo","Tinos",
 "Inconsolata","Source Code Pro","JetBrains Mono","Fira Code","Courier Prime",
 "Roboto Mono","Pacifico","Dancing Script","Lobster","Great Vibes","Satisfy",
 "Anton","Passion One","Staatliches","Fjalla One","Orbitron","Exo",
 "Roboto Condensed","Nunito Sans","Mulish","Hind","Varela Round","Chivo"];

const loadedFonts=new Set();
function ensureFont(f){
  if(loadedFonts.has(f)) return;
  loadedFonts.add(f);
  const l=document.createElement("link");
  l.rel="stylesheet";
  l.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(f)}&display=swap`;
  document.head.appendChild(l);
}
let activeFont=null;
function filterFonts(q){buildDD(q?GFONTS.filter(f=>f.toLowerCase().includes(q.toLowerCase())):GFONTS);openDD();}
function openDD(){buildDD(GFONTS);document.getElementById("font-dd").classList.add("open");}
function closeDD(){document.getElementById("font-dd").classList.remove("open");}
function buildDD(list){
  const dd=document.getElementById("font-dd");dd.innerHTML="";
  list.slice(0,80).forEach(f=>{
    ensureFont(f);
    const d=document.createElement("div");
    d.className="font-opt"+(f===activeFont?" active":"");
    d.innerHTML=`<span style="font-family:'${f}',sans-serif">${f}</span>`;
    d.addEventListener("mousedown",e=>{e.preventDefault();pickFont(f);});
    dd.appendChild(d);
  });
}
function pickFont(f){
  activeFont=f;
  document.getElementById("font-search").value=f;
  closeDD();
  ensureFont(f);
  if(activeSpanEl){
    activeSpanEl.style.fontFamily=`'${f}',sans-serif`;
    activeSpanEl.dataset.pendingFont=f;
    markDirty();
  }
}
document.addEventListener("click",e=>{if(!e.target.closest(".font-wrap")) closeDD();});

function updateColorBar(){
  document.getElementById("color-bar").style.background=document.getElementById("color-pick").value;
}

// ------------------------------------------------------------------ //
//  State                                                               //
// ------------------------------------------------------------------ //
let sessionId=null, pageCount=1, currentPage=0;
let allSpans=[], allImages=[];
let activeSpanEl=null, activeSpanData=null;
let activeImgIdx=null;
let dirty=false;
const ZOOM=1.5;

// ------------------------------------------------------------------ //
//  UI helpers                                                          //
// ------------------------------------------------------------------ //
function showLoading(m){document.getElementById("loading-text").textContent=m||"Processing…";document.getElementById("loading").classList.add("show");}
function hideLoading(){document.getElementById("loading").classList.remove("show");}
function setStatus(m,cls){const el=document.getElementById("sb-status");el.textContent=m;el.className="sb"+(cls?" "+cls:"");}
function setSbInfo(m){document.getElementById("sb-info").textContent=m;}
function setSbPos(m){document.getElementById("sb-pos").textContent=m;}
function scaleF(){const img=document.getElementById("pdf-img");return{sx:img.clientWidth/img.naturalWidth,sy:img.clientHeight/img.naturalHeight};}
function screenToPdf(x,y){const{sx,sy}=scaleF();return{x:x/(ZOOM*sx),y:y/(ZOOM*sy)};}

function markDirty(){
  dirty=true;
  document.getElementById("btn-apply").disabled=false;
  document.getElementById("btn-cancel").disabled=false;
}

// ------------------------------------------------------------------ //
//  Upload                                                              //
// ------------------------------------------------------------------ //
document.getElementById("file-input").addEventListener("change",e=>{if(e.target.files[0])uploadFile(e.target.files[0]);});
document.body.addEventListener("dragover",e=>{e.preventDefault();document.getElementById("drop-card")?.classList.add("drag-over");});
document.body.addEventListener("dragleave",()=>document.getElementById("drop-card")?.classList.remove("drag-over"));
document.body.addEventListener("drop",e=>{
  e.preventDefault();document.getElementById("drop-card")?.classList.remove("drag-over");
  const f=e.dataTransfer.files[0];if(f?.name.endsWith(".pdf"))uploadFile(f);
});

async function uploadFile(file){
  showLoading("Opening "+file.name+"…");
  const fd=new FormData();fd.append("file",file);
  try{
    const r=await fetch("/upload",{method:"POST",body:fd});
    if(!r.ok){const t=await r.text();alert("Upload failed");console.error(t);hideLoading();return;}
    const data=await r.json();
    sessionId=data.session_id;pageCount=data.page_count;currentPage=0;
    document.getElementById("drop-zone").style.display="none";
    document.getElementById("viewer").classList.add("show");
    document.getElementById("btn-save").disabled=false;
    document.getElementById("file-name-label").textContent=file.name;
    renderPage(data.page_image,data.spans,data.images||[]);
    setStatus("Click any text to edit","ok");
    setSbInfo(`${pageCount} page${pageCount>1?"s":""} · ${Math.round(file.size/1024)} KB`);
    hideLoading();
  }catch(e){alert("Error: "+e.message);hideLoading();}
}

// ------------------------------------------------------------------ //
//  Render page                                                         //
// ------------------------------------------------------------------ //
function renderPage(b64,spans,images){
  cancelEdit();
  const img=document.getElementById("pdf-img");
  img.src="data:image/png;base64,"+b64;
  allSpans=spans;allImages=images||[];
  img.onload=()=>buildLayers();
  if(img.complete&&img.naturalWidth) buildLayers();
  document.getElementById("page-label").textContent=`Page ${currentPage+1} / ${pageCount}`;
  document.getElementById("btn-prev").disabled=currentPage===0;
  document.getElementById("btn-next").disabled=currentPage===pageCount-1;
}

function buildLayers(){
  buildTextLayer();
  buildImgLayer();
}
window.addEventListener("resize",()=>{if(allSpans.length)buildLayers();});

// ------------------------------------------------------------------ //
//  Text layer — spans are directly editable divs over the PDF         //
// ------------------------------------------------------------------ //
function buildTextLayer(){
  const layer=document.getElementById("text-layer");
  layer.innerHTML="";
  const{sx,sy}=scaleF();
  allSpans.forEach((span,idx)=>{
    const[x0,y0,x1,y1]=span.bbox;
    const pxFs=span.size*ZOOM*sy;
    const el=document.createElement("div");
    el.className="span-el";
    el.dataset.idx=idx;
    el.textContent=span.text;
    el.style.cssText=`
      left:${x0*ZOOM*sx}px;
      top:${y0*ZOOM*sy}px;
      min-width:${(x1-x0)*ZOOM*sx}px;
      font-size:${pxFs}px;
      font-family:'${span.font}',sans-serif;
      line-height:${pxFs*1.1}px;
      color:transparent;
      pointer-events:all;
    `;
    el.addEventListener("click",e=>{e.stopPropagation();activateSpan(idx,el);});
    el.addEventListener("mouseenter",()=>{if(el!==activeSpanEl) setSbPos(span.text.trim().substring(0,60));});
    layer.appendChild(el);
  });
  // Click on blank area deactivates
  document.getElementById("pdf-img").addEventListener("click",()=>cancelEdit(),{once:false});
}

function activateSpan(idx,el){
  if(activeSpanEl===el) return;
  cancelEdit();
  activeSpanEl=el;
  activeSpanData=allSpans[idx];
  el.classList.add("editing");
  el.style.color=colorIntToHex(activeSpanData.color);
  el.style.background="rgba(26,115,232,0.06)";
  el.contentEditable="true";
  // Position caret at end
  el.focus();
  const range=document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  // Populate toolbar
  activeFont=null;
  document.getElementById("font-search").value=activeSpanData.font;
  document.getElementById("size-input").value=Math.round(activeSpanData.size);
  document.getElementById("color-pick").value=colorIntToHex(activeSpanData.color);
  updateColorBar();
  updateStyleBtns();
  markDirty();
  setStatus("Editing — Enter to apply, Esc to cancel");
  el.addEventListener("input",markDirty,{once:false});
  el.addEventListener("keydown",onSpanKey);
}

function onSpanKey(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();applyEdit();}
  if(e.key==="Escape"){e.preventDefault();cancelEdit();}
  if(e.ctrlKey||e.metaKey){
    if(e.key==="b"){e.preventDefault();fmt("bold");}
    if(e.key==="i"){e.preventDefault();fmt("italic");}
    if(e.key==="u"){e.preventDefault();fmt("underline");}
  }
}

function colorIntToHex(n){
  const hex=("000000"+(n>>>0).toString(16)).slice(-6);
  return"#"+hex;
}

function colorHexToTuple(h){
  const r=parseInt(h.slice(1,3),16)/255;
  const g=parseInt(h.slice(3,5),16)/255;
  const b=parseInt(h.slice(5,7),16)/255;
  return[r,g,b];
}

// ------------------------------------------------------------------ //
//  Format buttons                                                      //
// ------------------------------------------------------------------ //
function fmt(cmd){
  if(!activeSpanEl) return;
  document.execCommand(cmd);
  updateStyleBtns();
  markDirty();
}
function setAlign(a){
  if(!activeSpanEl) return;
  activeSpanEl.style.textAlign=a;
  markDirty();
}
function updateStyleBtns(){
  document.getElementById("btn-bold").classList.toggle("active",document.queryCommandState("bold"));
  document.getElementById("btn-italic").classList.toggle("active",document.queryCommandState("italic"));
  document.getElementById("btn-underline").classList.toggle("active",document.queryCommandState("underline"));
}

// size input change
document.getElementById("size-input").addEventListener("change",function(){
  if(!activeSpanEl) return;
  const sz=parseFloat(this.value)||12;
  const{sy}=scaleF();
  const pxFs=sz*ZOOM*sy;
  activeSpanEl.style.fontSize=pxFs+"px";
  activeSpanEl.style.lineHeight=(pxFs*1.1)+"px";
  activeSpanEl.dataset.pendingSize=sz;
  markDirty();
});

// color input change
document.getElementById("color-pick").addEventListener("input",function(){
  if(!activeSpanEl) return;
  updateColorBar();
  activeSpanEl.style.color=this.value;
  markDirty();
});

// ------------------------------------------------------------------ //
//  Apply / Cancel                                                      //
// ------------------------------------------------------------------ //
async function applyEdit(){
  if(!activeSpanEl||!activeSpanData||!dirty) return;
  const newText=activeSpanEl.innerText.trim();
  if(!newText){cancelEdit();return;}
  const gfont=activeFont||null;
  const body={
    session_id:sessionId,
    page:currentPage,
    bbox:activeSpanData.bbox,
    new_text:newText,
    font:activeSpanData.font,
  };
  if(gfont) body.gfont=gfont;
  document.getElementById("btn-apply").disabled=true;
  setStatus("Saving…");
  try{
    const r=await fetch("/edit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();console.error(t);setStatus("Error saving","warn");return;}
    const data=await r.json();
    if(data.success){
      setStatus(data.font_preserved?"Saved ✓":"Saved (fallback font)","ok");
      dirty=false;
      renderPage(data.page_image,data.spans,data.images);
    }else{setStatus("Save failed","warn");}
  }catch(e){setStatus("Error: "+e.message,"warn");}
}

function cancelEdit(){
  if(activeSpanEl){
    activeSpanEl.classList.remove("editing");
    activeSpanEl.contentEditable="false";
    activeSpanEl.style.color="transparent";
    activeSpanEl.style.background="transparent";
    if(activeSpanData) activeSpanEl.textContent=activeSpanData.text;
    activeSpanEl.removeEventListener("keydown",onSpanKey);
    activeSpanEl=null;activeSpanData=null;
  }
  dirty=false;
  document.getElementById("btn-apply").disabled=true;
  document.getElementById("btn-cancel").disabled=true;
  setSbPos("");
}

// ------------------------------------------------------------------ //
//  Image layer                                                         //
// ------------------------------------------------------------------ //
function buildImgLayer(){
  document.querySelectorAll(".img-box").forEach(el=>el.remove());
  document.getElementById("img-ctx").style.display="none";
  const layer=document.getElementById("img-layer");
  const{sx,sy}=scaleF();
  allImages.forEach((img,idx)=>{
    const[x0,y0,x1,y1]=img.bbox;
    const d=document.createElement("div");d.className="img-box";d.dataset.idx=idx;
    d.style.cssText=`left:${x0*ZOOM*sx}px;top:${y0*ZOOM*sy}px;width:${(x1-x0)*ZOOM*sx}px;height:${(y1-y0)*ZOOM*sy}px;pointer-events:all;`;
    const badge=document.createElement("div");badge.className="img-badge";badge.textContent="IMAGE";d.appendChild(badge);
    addImgInteraction(d,idx);
    layer.appendChild(d);
  });
}

function addImgInteraction(el,idx){
  let sx2,sy2,moved=false;
  const ghost=document.getElementById("drag-ghost");
  el.addEventListener("mousedown",e=>{
    e.stopPropagation();e.preventDefault();
    sx2=e.clientX;sy2=e.clientY;moved=false;
    ghost.className="drag-ghost img";
    ghost.style.cssText=`left:${el.style.left};top:${el.style.top};width:${el.style.width};height:${el.style.height};`;
    function onMove(e2){
      const dx=e2.clientX-sx2,dy=e2.clientY-sy2;
      if(Math.abs(dx)>4||Math.abs(dy)>4){
        moved=true;
        ghost.style.left=(parseFloat(el.style.left)+dx)+"px";
        ghost.style.top=(parseFloat(el.style.top)+dy)+"px";
        ghost.style.display="block";
        el.classList.add("dragging");
      }
    }
    function onUp(e2){
      document.removeEventListener("mousemove",onMove);
      document.removeEventListener("mouseup",onUp);
      ghost.style.display="none";
      el.classList.remove("dragging");
      if(moved) moveImage(idx,e2.clientX-sx2,e2.clientY-sy2);
      else selectImg(idx,el);
    }
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });
}

function selectImg(idx,el){
  document.querySelectorAll(".img-box").forEach(e=>e.classList.remove("selected"));
  document.querySelectorAll(".rh").forEach(e=>e.remove());
  activeImgIdx=idx;
  el.classList.add("selected");
  ["tl","tr","bl","br"].forEach(pos=>{
    const rh=document.createElement("div");rh.className=`rh rh-${pos}`;
    addResizeHandle(rh,el,idx,pos);el.appendChild(rh);
  });
  const ctx=document.getElementById("img-ctx");
  ctx.innerHTML="";
  ctx.style.cssText=`display:flex;left:${parseFloat(el.style.left)}px;top:${parseFloat(el.style.top)+parseFloat(el.style.height)+6}px;`;
  [
    {cls:"ic-replace",text:"↺ Replace",fn:()=>document.getElementById("img-replace-input").click()},
    {cls:"ic-delete",text:"🗑 Delete",fn:()=>deleteImage(idx)},
    {cls:"ic-cancel",text:"✗",fn:()=>{ctx.style.display="none";el.classList.remove("selected");el.querySelectorAll(".rh").forEach(r=>r.remove());}},
  ].forEach(({cls,text,fn})=>{const b=document.createElement("button");b.className="ic-btn "+cls;b.textContent=text;b.addEventListener("click",fn);ctx.appendChild(b);});
}

function addResizeHandle(rh,boxEl,idx,corner){
  let sx3,sy3,origBbox;
  rh.addEventListener("mousedown",e=>{
    e.stopPropagation();e.preventDefault();
    sx3=e.clientX;sy3=e.clientY;origBbox=[...allImages[idx].bbox];
    const{sx,sy}=scaleF();
    function calc(e2){
      const dxPdf=(e2.clientX-sx3)/(ZOOM*sx),dyPdf=(e2.clientY-sy3)/(ZOOM*sy);
      let[nx0,ny0,nx1,ny1]=origBbox;
      if(corner==="tl"){nx0+=dxPdf;ny0+=dyPdf;}
      else if(corner==="tr"){nx1+=dxPdf;ny0+=dyPdf;}
      else if(corner==="bl"){nx0+=dxPdf;ny1+=dyPdf;}
      else{nx1+=dxPdf;ny1+=dyPdf;}
      if(nx1-nx0<20)nx1=nx0+20;if(ny1-ny0<20)ny1=ny0+20;
      return[nx0,ny0,nx1,ny1];
    }
    function onMove(e2){const[nx0,ny0,nx1,ny1]=calc(e2);const{sx,sy}=scaleF();boxEl.style.left=(nx0*ZOOM*sx)+"px";boxEl.style.top=(ny0*ZOOM*sy)+"px";boxEl.style.width=((nx1-nx0)*ZOOM*sx)+"px";boxEl.style.height=((ny1-ny0)*ZOOM*sy)+"px";}
    async function onUp(e2){
      document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);
      showLoading("Resizing…");
      const fd=new FormData();fd.append("op","resize");fd.append("session_id",sessionId);fd.append("page",currentPage);fd.append("bbox",origBbox.join(","));fd.append("new_bbox",calc(e2).join(","));
      try{const r=await fetch("/image_op",{method:"POST",body:fd});if(r.ok){const d=await r.json();if(d.success)renderPage(d.page_image,d.spans,d.images);}}catch(e){}
      hideLoading();
    }
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);
  });
}

document.getElementById("img-replace-input").addEventListener("change",async e=>{
  if(!e.target.files[0]||activeImgIdx===null) return;
  showLoading("Replacing…");
  const img=allImages[activeImgIdx];
  const fd=new FormData();fd.append("op","replace");fd.append("session_id",sessionId);fd.append("page",currentPage);fd.append("bbox",img.bbox.join(","));fd.append("image",e.target.files[0]);
  try{const r=await fetch("/image_op",{method:"POST",body:fd});if(r.ok){const d=await r.json();if(d.success)renderPage(d.page_image,d.spans,d.images);}}catch(err){}
  e.target.value="";hideLoading();
});

async function deleteImage(idx){
  showLoading("Deleting…");
  const fd=new FormData();fd.append("op","delete");fd.append("session_id",sessionId);fd.append("page",currentPage);fd.append("bbox",allImages[idx].bbox.join(","));
  try{const r=await fetch("/image_op",{method:"POST",body:fd});if(r.ok){const d=await r.json();if(d.success)renderPage(d.page_image,d.spans,d.images);}}catch(e){}
  hideLoading();
}

async function moveImage(idx,dxPx,dyPx){
  const img=allImages[idx];
  const p=screenToPdf(dxPx,dyPx);
  const[x0,y0,x1,y1]=img.bbox;
  showLoading("Moving…");
  const fd=new FormData();fd.append("op","resize");fd.append("session_id",sessionId);fd.append("page",currentPage);fd.append("bbox",[x0,y0,x1,y1].join(","));fd.append("new_bbox",[x0+p.x,y0+p.y,x1+p.x,y1+p.y].join(","));
  try{const r=await fetch("/image_op",{method:"POST",body:fd});if(r.ok){const d=await r.json();if(d.success)renderPage(d.page_image,d.spans,d.images);}}catch(e){}
  hideLoading();
}

// ------------------------------------------------------------------ //
//  Page nav + download                                                 //
// ------------------------------------------------------------------ //
async function changePage(delta){
  const next=currentPage+delta;
  if(next<0||next>=pageCount) return;
  showLoading("Loading page…");
  const r=await fetch(`/page/${sessionId}/${next}`);
  if(!r.ok){hideLoading();return;}
  const data=await r.json();
  currentPage=next;
  renderPage(data.page_image,data.spans,data.images||[]);
  hideLoading();
}
function downloadPDF(){if(sessionId) window.location.href=`/download/${sessionId}`;}
</script>
