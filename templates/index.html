<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePfer — PDF Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --brand:   #0A0F1E;
  --accent:  #2563EB;
  --purple:  #7C3AED;
  --success: #16A34A;
  --warn:    #D97706;
  --danger:  #DC2626;
  --bg:      #F1F5F9;
  --panel:   #FFFFFF;
  --border:  #E2E8F0;
  --text:    #0F172A;
  --muted:   #64748B;
  --radius:  12px;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---- TOPBAR ---- */
.topbar {
  background: var(--brand);
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.logo {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #60A5FA, #A78BFA);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-right: 8px;
}
.btn {
  padding: 7px 16px;
  border-radius: 8px;
  border: none;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #1D4ED8; }
.btn-ghost { background: rgba(255,255,255,0.08); color: #CBD5E1; }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
.btn-success { background: var(--success); color: #fff; }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.font-badge {
  font-size: 0.75rem;
  color: #64748B;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 3px 10px;
}

/* ---- MAIN ---- */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ---- DROP ZONE ---- */
#drop-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  cursor: pointer;
}
.drop-card {
  background: var(--panel);
  border: 2px dashed var(--border);
  border-radius: 20px;
  padding: 3rem 4rem;
  text-align: center;
  transition: border-color .2s, background .2s;
  max-width: 480px;
  width: 90%;
}
.drop-card:hover, .drop-card.drag-over {
  border-color: var(--accent);
  background: #EFF6FF;
}
.drop-icon { font-size: 3rem; margin-bottom: 1rem; }
.drop-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
.drop-sub { color: var(--muted); font-size: 0.9rem; }
.drop-hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.75rem; }

/* ---- EDITOR ---- */
#editor { display: none; flex: 1; overflow: hidden; }

/* Viewer */
.viewer {
  flex: 1;
  overflow: auto;
  background: #475569;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  gap: 12px;
}
.page-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,0,0,0.5);
  border-radius: 999px;
  padding: 6px 14px;
  color: #fff;
  font-size: 0.875rem;
  position: sticky;
  top: 0;
  z-index: 10;
}
.page-nav button {
  background: none;
  border: none;
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
}
.page-nav button:hover { background: rgba(255,255,255,0.15); }
.page-nav button:disabled { opacity: 0.3; cursor: default; }

.pdf-wrap {
  position: relative;
  display: inline-block;
  line-height: 0;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#pdf-img {
  display: block;
  max-width: 100%;
  height: auto;
  cursor: crosshair;
}
#overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.span-box {
  position: absolute;
  pointer-events: all;
  cursor: pointer;
  border: 1.5px solid transparent;
  border-radius: 2px;
  transition: border-color .1s, background .1s;
}
.span-box:hover { border-color: rgba(37,99,235,0.6); background: rgba(37,99,235,0.08); }
.span-box.selected { border-color: var(--accent); background: rgba(37,99,235,0.12); }

/* Side panel */
.side {
  width: 300px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.side-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.side-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.info-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 0.85rem;
}
.info-label { color: var(--muted); min-width: 44px; }
.info-val { color: var(--text); font-weight: 500; word-break: break-word; }
.match-exact { color: var(--success); }
.match-approx { color: var(--warn); }
.match-none { color: var(--danger); }

textarea#edit-input {
  width: 100%;
  min-height: 90px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  font-size: 0.9rem;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color .15s;
}
textarea#edit-input:focus { border-color: var(--accent); }

.edit-result {
  font-size: 0.8rem;
  margin-top: 8px;
  min-height: 1.2em;
}

/* Spans list */
.spans-list {
  flex: 1;
  overflow-y: auto;
}
.span-item {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .1s;
  font-size: 0.8rem;
}
.span-item:hover { background: #F8FAFC; }
.span-item.active { background: #EFF6FF; border-left: 3px solid var(--accent); }
.span-item-font { color: var(--muted); font-size: 0.72rem; }
.span-item-text { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Loading overlay */
#loading {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,15,30,0.7);
  z-index: 999;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 1rem;
  color: #fff;
  font-size: 1rem;
  backdrop-filter: blur(4px);
}
#loading.show { display: flex; }
.ring {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #2563EB;
  border-right-color: #7C3AED;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#file-input { display: none; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="ring"></div>
  <span id="loading-text">Processing…</span>
</div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept=".pdf">

<!-- Topbar -->
<div class="topbar">
  <span class="logo">FreePfer</span>
  <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">Open PDF</button>
  <button class="btn btn-ghost" id="btn-download" disabled onclick="downloadPDF()">Download</button>
  <div class="topbar-right">
    <span class="font-badge" id="font-count">Indexing fonts…</span>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Drop zone -->
  <div id="drop-zone">
    <div class="drop-card" id="drop-card">
      <div class="drop-icon">📄</div>
      <div class="drop-title">Drop your PDF here</div>
      <div class="drop-sub">or click <strong>Open PDF</strong> above</div>
      <div class="drop-hint">Edits text in-place · Matches native fonts · Free</div>
    </div>
  </div>

  <!-- Editor -->
  <div id="editor" style="display:none; flex:1; overflow:hidden; display:flex;">

    <!-- Viewer -->
    <div class="viewer" id="viewer">
      <div class="page-nav">
        <button id="btn-prev" onclick="changePage(-1)">◀</button>
        <span id="page-label">Page 1 of 1</span>
        <button id="btn-next" onclick="changePage(1)">▶</button>
      </div>
      <div class="pdf-wrap">
        <img id="pdf-img" src="" alt="PDF page">
        <div id="overlay"></div>
      </div>
    </div>

    <!-- Side panel -->
    <div class="side">
      <div class="side-section">
        <div class="side-label">Selected Span</div>
        <div class="info-row"><span class="info-label">Text</span><span class="info-val" id="info-text">—</span></div>
        <div class="info-row"><span class="info-label">Font</span><span class="info-val" id="info-font">—</span></div>
        <div class="info-row"><span class="info-label">Size</span><span class="info-val" id="info-size">—</span></div>
        <div class="info-row"><span class="info-label">Match</span><span class="info-val" id="info-match">—</span></div>
      </div>

      <div class="side-section">
        <div class="side-label">Edit Text</div>
        <textarea id="edit-input" placeholder="Select a span on the page first…" disabled></textarea>
        <button class="btn btn-primary" id="btn-apply" style="width:100%;margin-top:8px;" disabled onclick="applyEdit()">Apply Edit</button>
        <div class="edit-result" id="edit-result"></div>
      </div>

      <div class="side-label" style="padding:12px 16px 4px;">Spans on Page</div>
      <div class="spans-list" id="spans-list"></div>
    </div>

  </div>
</div>

<script>
// ------------------------------------------------------------------ //
//  State                                                               //
// ------------------------------------------------------------------ //
let sessionId   = null;
let pageCount   = 1;
let currentPage = 0;
let allSpans    = [];
let selectedSpan = null;
const ZOOM      = 1.5;  // must match server-side zoom

// ------------------------------------------------------------------ //
//  UI helpers                                                          //
// ------------------------------------------------------------------ //
function showLoading(msg = "Processing…") {
  document.getElementById("loading-text").textContent = msg;
  document.getElementById("loading").classList.add("show");
}
function hideLoading() {
  document.getElementById("loading").classList.remove("show");
}

function setEditResult(msg, type = "ok") {
  const el = document.getElementById("edit-result");
  el.textContent = msg;
  el.style.color = type === "ok" ? "var(--success)"
                 : type === "warn" ? "var(--warn)"
                 : "var(--danger)";
}

// ------------------------------------------------------------------ //
//  Font count badge                                                    //
// ------------------------------------------------------------------ //
async function checkFontCount() {
  try {
    const r = await fetch("/ping");
    if (r.ok) {
      document.getElementById("font-count").textContent = "Ready";
    }
  } catch(_) {}
}
checkFontCount();

// ------------------------------------------------------------------ //
//  File upload                                                         //
// ------------------------------------------------------------------ //
document.getElementById("file-input").addEventListener("change", e => {
  if (e.target.files[0]) uploadFile(e.target.files[0]);
});

// Drag and drop
const dropCard = document.getElementById("drop-card");
document.body.addEventListener("dragover", e => { e.preventDefault(); dropCard.classList.add("drag-over"); });
document.body.addEventListener("dragleave", () => dropCard.classList.remove("drag-over"));
document.body.addEventListener("drop", e => {
  e.preventDefault();
  dropCard.classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith(".pdf")) uploadFile(file);
});

async function uploadFile(file) {
  showLoading("Uploading PDF…");
  const fd = new FormData();
  fd.append("file", file);
  try {
    const r = await fetch("/upload", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) { alert(data.error || "Upload failed"); hideLoading(); return; }

    sessionId   = data.session_id;
    pageCount   = data.page_count;
    currentPage = 0;

    document.getElementById("drop-zone").style.display = "none";
    document.getElementById("editor").style.display    = "flex";
    document.getElementById("btn-download").disabled   = false;

    renderPage(data.page_image, data.spans);
    hideLoading();
  } catch(e) {
    alert("Error: " + e.message);
    hideLoading();
  }
}

// ------------------------------------------------------------------ //
//  Page rendering                                                      //
// ------------------------------------------------------------------ //
function renderPage(b64img, spans) {
  const img = document.getElementById("pdf-img");
  img.src = "data:image/png;base64," + b64img;
  allSpans = spans;
  img.onload = () => drawOverlay(spans);
  if (img.complete) drawOverlay(spans);

  document.getElementById("page-label").textContent =
    `Page ${currentPage + 1} of ${pageCount}`;
  document.getElementById("btn-prev").disabled = currentPage === 0;
  document.getElementById("btn-next").disabled = currentPage === pageCount - 1;

  buildSpansList(spans);
  clearSelection();
}

function drawOverlay(spans) {
  const img     = document.getElementById("pdf-img");
  const overlay = document.getElementById("overlay");
  overlay.innerHTML = "";

  const W = img.naturalWidth;
  const scaleX = img.clientWidth  / W;
  const scaleY = img.clientHeight / (img.naturalHeight);

  spans.forEach((span, idx) => {
    const [x0, y0, x1, y1] = span.bbox;
    const div = document.createElement("div");
    div.className = "span-box";
    div.style.left   = (x0 * ZOOM * scaleX) + "px";
    div.style.top    = (y0 * ZOOM * scaleY) + "px";
    div.style.width  = ((x1 - x0) * ZOOM * scaleX) + "px";
    div.style.height = ((y1 - y0) * ZOOM * scaleY) + "px";
    div.dataset.idx  = idx;
    div.title        = span.text;
    div.addEventListener("click", () => selectSpan(idx));
    overlay.appendChild(div);
  });
}

window.addEventListener("resize", () => {
  if (allSpans.length) drawOverlay(allSpans);
});

// ------------------------------------------------------------------ //
//  Page navigation                                                     //
// ------------------------------------------------------------------ //
async function changePage(delta) {
  const next = currentPage + delta;
  if (next < 0 || next >= pageCount) return;
  showLoading("Loading page…");
  try {
    const r    = await fetch(`/page/${sessionId}/${next}`);
    const data = await r.json();
    currentPage = next;
    renderPage(data.page_image, data.spans);
  } catch(e) { alert("Error: " + e.message); }
  hideLoading();
}

// ------------------------------------------------------------------ //
//  Span selection                                                      //
// ------------------------------------------------------------------ //
function selectSpan(idx) {
  selectedSpan = allSpans[idx];

  // Highlight overlay box
  document.querySelectorAll(".span-box").forEach(el => el.classList.remove("selected"));
  const box = document.querySelector(`.span-box[data-idx="${idx}"]`);
  if (box) box.classList.add("selected");

  // Highlight list item
  document.querySelectorAll(".span-item").forEach(el => el.classList.remove("active"));
  const li = document.querySelector(`.span-item[data-idx="${idx}"]`);
  if (li) { li.classList.add("active"); li.scrollIntoView({ block: "nearest" }); }

  // Info panel
  document.getElementById("info-text").textContent = selectedSpan.text.slice(0, 60);
  document.getElementById("info-font").textContent = selectedSpan.font;
  document.getElementById("info-size").textContent = selectedSpan.size + " pt";

  const matchEl = document.getElementById("info-match");
  matchEl.className = "info-val";
  matchEl.textContent = "Checking…";
  // We'll show match info after edit result

  // Edit box
  const inp = document.getElementById("edit-input");
  inp.disabled = false;
  inp.value    = selectedSpan.text;
  inp.focus();
  document.getElementById("btn-apply").disabled = false;
  document.getElementById("edit-result").textContent = "";
}

function clearSelection() {
  selectedSpan = null;
  document.getElementById("info-text").textContent = "—";
  document.getElementById("info-font").textContent = "—";
  document.getElementById("info-size").textContent = "—";
  document.getElementById("info-match").textContent = "—";
  document.getElementById("edit-input").disabled = true;
  document.getElementById("edit-input").value = "";
  document.getElementById("btn-apply").disabled = true;
  document.getElementById("edit-result").textContent = "";
}

function buildSpansList(spans) {
  const list = document.getElementById("spans-list");
  list.innerHTML = "";
  spans.forEach((span, idx) => {
    const div = document.createElement("div");
    div.className  = "span-item";
    div.dataset.idx = idx;
    div.innerHTML  = `<div class="span-item-font">${span.font}</div>
                      <div class="span-item-text">${span.text.replace(/</g,"&lt;")}</div>`;
    div.addEventListener("click", () => selectSpan(idx));
    list.appendChild(div);
  });
}

// ------------------------------------------------------------------ //
//  Apply edit                                                          //
// ------------------------------------------------------------------ //
async function applyEdit() {
  if (!selectedSpan) return;
  const newText = document.getElementById("edit-input").value.trim();
  if (!newText) return;

  showLoading("Applying edit…");
  try {
    const r = await fetch("/edit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId,
        page:       currentPage,
        bbox:       selectedSpan.bbox,
        new_text:   newText,
        font:       selectedSpan.font,
      }),
    });
    const data = await r.json();
    if (!r.ok) { setEditResult("✗ " + (data.error || "Edit failed"), "error"); hideLoading(); return; }

    if (data.success) {
      const matchEl = document.getElementById("info-match");
      if (data.font_preserved) {
        setEditResult(`✓ Font preserved`, "ok");
        matchEl.textContent = `✓ ${data.font_used.split("/").pop() || data.font_used}`;
        matchEl.className = "info-val match-exact";
      } else {
        setEditResult(`⚠ Fallback: ${data.font_used}`, "warn");
        matchEl.textContent = `⚠ Fallback used`;
        matchEl.className = "info-val match-approx";
      }
      renderPage(data.page_image, data.spans);
    } else {
      setEditResult("✗ " + data.message, "error");
    }
  } catch(e) {
    setEditResult("✗ " + e.message, "error");
  }
  hideLoading();
}

// Enter key in textarea
document.getElementById("edit-input")?.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) applyEdit();
});

// ------------------------------------------------------------------ //
//  Download                                                            //
// ------------------------------------------------------------------ //
function downloadPDF() {
  if (!sessionId) return;
  window.location.href = `/download/${sessionId}`;
}
</script>
</body>
</html>
