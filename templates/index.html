<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreePfer — PDF Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;
  --accent:#e94560;--accent2:#533483;--blue:#2563eb;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;
  --success:#22c55e;--warn:#f59e0b;--danger:#ef4444;--yellow:#eab308;
  --toolbar:#0d1117;--viewer:#111827;
  --radius:8px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--viewer);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px;}

/* ── TOOLBAR ── */
.toolbar{background:var(--toolbar);height:52px;display:flex;align-items:center;padding:0 16px;gap:6px;flex-shrink:0;border-bottom:1px solid var(--border);user-select:none;}
.logo{display:flex;align-items:center;gap:8px;margin-right:8px;cursor:default;}
.logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;letter-spacing:-1px;}
.logo-text{font-size:15px;font-weight:700;color:#fff;letter-spacing:-0.3px;}
.logo-text span{color:var(--accent);}

.tb-sep{width:1px;height:24px;background:var(--border2);margin:0 4px;flex-shrink:0;}

.tb-btn{height:32px;padding:0 12px;border-radius:var(--radius);border:none;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit;}
.tb-btn:disabled{opacity:.3;cursor:not-allowed;}
.tb-btn-primary{background:var(--accent);color:#fff;}
.tb-btn-primary:hover:not(:disabled){background:#c73651;}
.tb-btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2);}
.tb-btn-ghost:hover:not(:disabled){background:rgba(255,255,255,0.06);color:var(--text);}
.tb-btn-success{background:rgba(34,197,94,0.15);color:var(--success);border:1px solid rgba(34,197,94,0.25);}
.tb-btn-success:hover:not(:disabled){background:rgba(34,197,94,0.22);}

/* Font selector */
.font-group{display:none;align-items:center;gap:6px;}
.font-group.show{display:flex;}
.font-search-wrap{position:relative;}
#font-search{background:rgba(255,255,255,0.07);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:12px;font-family:inherit;padding:5px 10px;width:160px;outline:none;}
#font-search:focus{border-color:var(--accent);background:rgba(255,255,255,0.1);}
#font-search::placeholder{color:var(--dim);}
.font-dd{display:none;position:absolute;top:calc(100% + 4px);left:0;width:220px;background:#0d1117;border:1px solid var(--border2);border-radius:var(--radius);max-height:280px;overflow-y:auto;z-index:300;box-shadow:0 12px 40px rgba(0,0,0,.7);}
.font-dd.open{display:block;}
.font-opt{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.04);}
.font-opt:hover,.font-opt.active{background:rgba(233,69,96,.12);color:#fff;}
#size-label{background:rgba(255,255,255,.07);border:1px solid var(--border2);border-radius:var(--radius);color:var(--muted);font-size:12px;padding:5px 10px;min-width:52px;text-align:center;}

.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.file-info{font-size:11.5px;color:var(--dim);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── PAGE NAV ── */
.page-nav{display:none;background:var(--toolbar);border-bottom:1px solid var(--border);height:34px;align-items:center;justify-content:center;gap:10px;flex-shrink:0;}
.page-nav.show{display:flex;}
.pn-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;}
.pn-btn:disabled{opacity:.25;cursor:default;}
.pn-btn:not(:disabled):hover{background:rgba(255,255,255,.07);color:var(--text);}
#page-label{font-size:12px;color:var(--dim);min-width:90px;text-align:center;}

/* ── MAIN ── */
.main{flex:1;overflow:hidden;display:flex;position:relative;}

/* ── DROP ── */
#drop-zone{flex:1;display:flex;align-items:center;justify-content:center;background:var(--viewer);}
.drop-card{background:rgba(255,255,255,.03);border:2px dashed rgba(255,255,255,.1);border-radius:16px;padding:3.5rem 4rem;text-align:center;max-width:460px;width:92%;transition:.2s;}
.drop-card.drag-over,.drop-card:hover{border-color:var(--accent);background:rgba(233,69,96,.05);}
.drop-icon{font-size:3rem;margin-bottom:1.2rem;line-height:1;}
.drop-title{font-size:1.3rem;font-weight:700;margin-bottom:.4rem;letter-spacing:-.3px;}
.drop-sub{color:var(--dim);font-size:13px;margin-bottom:1.2rem;}
.drop-cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;padding:9px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
.drop-cta:hover{background:#c73651;}
.drop-hint{font-size:11.5px;color:var(--dim);margin-top:1.2rem;line-height:1.8;}
.drop-hint strong{color:var(--muted);}

/* ── VIEWER ── */
#viewer{display:none;flex:1;overflow:auto;background:var(--viewer);align-items:flex-start;justify-content:center;padding:28px;}
#viewer.show{display:flex;}
.pdf-wrap{position:relative;display:inline-block;line-height:0;box-shadow:0 24px 64px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);border-radius:2px;}
#pdf-img{display:block;max-width:100%;height:auto;}
#overlay{position:absolute;inset:0;pointer-events:none;}
#overlay > *{pointer-events:all;}

/* ── BOX OVERLAYS ── */
.span-box{position:absolute;cursor:move;border:1.5px solid transparent;border-radius:2px;transition:border-color .12s,background .12s;}
.span-box:hover{border-color:rgba(37,99,235,.5);background:rgba(37,99,235,.06);}
.span-box.selected{border-color:#3b82f6;background:rgba(59,130,246,.08);}
.span-box.dragging{opacity:.45;border-color:#3b82f6;border-style:dashed;}

.img-box{position:absolute;cursor:move;border:2px solid transparent;border-radius:2px;transition:border-color .12s;}
.img-box:hover{border-color:rgba(234,179,8,.65);}
.img-box.selected{border-color:var(--yellow);box-shadow:0 0 0 1px rgba(234,179,8,.2);}
.img-box.dragging{opacity:.45;border-color:var(--yellow);border-style:dashed;}
.img-badge{position:absolute;top:-18px;left:-1px;background:var(--yellow);color:#000;font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px 3px 0 0;letter-spacing:.5px;pointer-events:none;white-space:nowrap;}

/* Resize handles */
.rh{position:absolute;width:9px;height:9px;background:var(--yellow);border:1.5px solid #000;border-radius:2px;z-index:10;}
.rh-tl{top:-5px;left:-5px;cursor:nw-resize;}
.rh-tr{top:-5px;right:-5px;cursor:ne-resize;}
.rh-bl{bottom:-5px;left:-5px;cursor:sw-resize;}
.rh-br{bottom:-5px;right:-5px;cursor:se-resize;}

/* Inline text input */
#inline-input{display:none;position:absolute;z-index:50;border:2px solid #3b82f6;border-radius:3px;outline:none;background:rgba(255,255,255,.97);color:#111;padding:1px 4px;line-height:1.3;min-width:60px;box-shadow:0 0 0 4px rgba(59,130,246,.2);}
#inline-input.show{display:block;}

/* ── CONTEXT TOOLBAR ── */
#ctx-bar{display:none;position:absolute;z-index:200;background:#0d1117;border:1px solid var(--border2);border-radius:var(--radius);padding:5px 7px;gap:5px;align-items:center;box-shadow:0 12px 36px rgba(0,0,0,.8);white-space:nowrap;}
#ctx-bar.show{display:flex;}
.ctx-btn{height:28px;padding:0 10px;border-radius:6px;border:none;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;gap:5px;}
.ctx-apply{background:var(--blue);color:#fff;}
.ctx-apply:hover{background:#1d4ed8;}
.ctx-cancel{background:rgba(255,255,255,.07);color:var(--muted);}
.ctx-cancel:hover{background:rgba(255,255,255,.12);color:var(--text);}
.ctx-delete{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.25);}
.ctx-delete:hover{background:rgba(239,68,68,.25);}
.ctx-replace{background:rgba(234,179,8,.12);color:var(--yellow);border:1px solid rgba(234,179,8,.25);}
.ctx-replace:hover{background:rgba(234,179,8,.22);}
.ctx-sep{width:1px;height:18px;background:var(--border2);}
#ctx-status{font-size:11px;color:var(--dim);min-width:60px;}

/* Drag ghost */
#drag-ghost{display:none;position:absolute;z-index:60;border:2px dashed #3b82f6;border-radius:3px;pointer-events:none;background:rgba(59,130,246,.08);}
#drag-ghost.img{border-color:var(--yellow);background:rgba(234,179,8,.07);}

/* ── STATUS BAR ── */
.statusbar{background:var(--toolbar);border-top:1px solid var(--border);height:26px;display:flex;align-items:center;padding:0 14px;gap:16px;flex-shrink:0;}
.sb-item{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}
.sb-dot.warn{background:var(--warn);}
.sb-right{margin-left:auto;}

/* ── LOADING ── */
#loading{display:none;position:fixed;inset:0;background:rgba(13,17,23,.75);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(4px);}
#loading.show{display:flex;}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin .8s linear infinite;}
#loading-text{font-size:13px;color:var(--muted);}
@keyframes spin{to{transform:rotate(360deg)}}

#file-input{display:none;}
#img-replace-input{display:none;}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><span id="loading-text">Processing…</span></div>
<input type="file" id="file-input" accept=".pdf">
<input type="file" id="img-replace-input" accept="image/*">

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="logo">
    <div class="logo-mark">fp</div>
    <div class="logo-text">Free<span>Pfer</span></div>
  </div>
  <div class="tb-sep"></div>

  <button class="tb-btn tb-btn-ghost" onclick="document.getElementById('file-input').click()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Open PDF
  </button>
  <button class="tb-btn tb-btn-success" id="btn-download" disabled onclick="downloadPDF()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Save PDF
  </button>

  <div class="tb-sep"></div>

  <!-- Font controls (shown when span selected) -->
  <div class="font-group" id="font-group">
    <div class="font-search-wrap">
      <input id="font-search" type="text" placeholder="Search Google Fonts…" autocomplete="off"
             oninput="filterFonts(this.value)" onfocus="openFontDrop()" onclick="openFontDrop()">
      <div class="font-dd" id="font-dd"></div>
    </div>
    <span id="size-label">—</span>
  </div>

  <div class="tb-right">
    <span class="file-info" id="file-info"></span>
    <span id="status-pill" style="font-size:11.5px;color:var(--dim);">No file open</span>
  </div>
</div>

<!-- PAGE NAV -->
<div class="page-nav" id="page-nav">
  <button class="pn-btn" id="btn-prev" onclick="changePage(-1)">◀</button>
  <span id="page-label">Page 1 of 1</span>
  <button class="pn-btn" id="btn-next" onclick="changePage(1)">▶</button>
</div>

<!-- MAIN -->
<div class="main">
  <div id="drop-zone">
    <div class="drop-card" id="drop-card">
      <div class="drop-icon">📄</div>
      <div class="drop-title">Open a PDF to edit</div>
      <div class="drop-sub">Drop a file here or click the button below</div>
      <button class="drop-cta" onclick="document.getElementById('file-input').click()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Choose PDF File
      </button>
      <div class="drop-hint">
        <strong>Click text</strong> to edit inline &nbsp;·&nbsp; <strong>Drag</strong> any element to move it<br>
        <strong>Images auto-detected</strong> — resize, replace or delete &nbsp;·&nbsp; <strong>Google Fonts</strong> built in
      </div>
    </div>
  </div>

  <div id="viewer">
    <div class="pdf-wrap" id="pdf-wrap">
      <img id="pdf-img" src="" alt="">
      <div id="overlay">
        <input id="inline-input" type="text" spellcheck="false">
        <div id="ctx-bar"></div>
        <div id="drag-ghost"></div>
      </div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="sb-item"><div class="sb-dot" id="sb-dot"></div><span id="sb-msg">Ready</span></div>
  <div class="sb-item sb-right" id="sb-info"></div>
</div>

<script>
// ------------------------------------------------------------------ //
//  Google Fonts                                                        //
// ------------------------------------------------------------------ //
const GFONTS = ["Roboto","Open Sans","Lato","Montserrat","Oswald","Raleway","Poppins",
 "Merriweather","Playfair Display","Ubuntu","PT Sans","Nunito","Source Sans Pro",
 "Libre Baskerville","Noto Sans","Noto Serif","Inter","Crimson Text","Josefin Sans",
 "Dosis","Quicksand","Cabin","Exo 2","Karla","Work Sans","Rubik","Fira Sans","Heebo",
 "Barlow","Titillium Web","Comfortaa","Zilla Slab","IBM Plex Sans","IBM Plex Serif",
 "DM Sans","DM Serif Display","Space Grotesk","Space Mono","Manrope","Outfit",
 "Plus Jakarta Sans","Lexend","Archivo","Jost","Figtree","Syne","Cormorant Garamond",
 "EB Garamond","Libre Caslon Text","Bodoni Moda","Spectral","Lora","Bitter","Arimo",
 "Tinos","Cousine","Inconsolata","Source Code Pro","JetBrains Mono","Fira Code",
 "Courier Prime","Roboto Mono","DM Mono","Overpass Mono","Anonymous Pro",
 "Pacifico","Dancing Script","Lobster","Great Vibes","Satisfy","Courgette",
 "Sacramento","Anton","Passion One","Staatliches","Alfa Slab One","Fjalla One",
 "Orbitron","Exo","Roboto Condensed","Barlow Condensed","Nunito Sans","Mulish",
 "Hind","Nanum Gothic","Varela Round","Questrial","Chivo","Libre Franklin","Raleway Dots"];

const loadedFonts = new Set();
function ensureFont(f){
  if(loadedFonts.has(f)) return;
  loadedFonts.add(f);
  const l=document.createElement("link");
  l.rel="stylesheet";
  l.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(f)}&display=swap`;
  document.head.appendChild(l);
}

let selectedFont=null;
function filterFonts(q){
  const list=q?GFONTS.filter(f=>f.toLowerCase().includes(q.toLowerCase())):GFONTS;
  buildDD(list);
  document.getElementById("font-dd").classList.add("open");
}
function openFontDrop(){buildDD(GFONTS);document.getElementById("font-dd").classList.add("open");}
function closeFontDrop(){document.getElementById("font-dd").classList.remove("open");}
function buildDD(list){
  const dd=document.getElementById("font-dd");
  dd.innerHTML="";
  list.slice(0,80).forEach(f=>{
    ensureFont(f);
    const d=document.createElement("div");
    d.className="font-opt"+(f===selectedFont?" active":"");
    d.innerHTML=`<span style="font-family:'${f}',sans-serif">${f}</span>`;
    d.addEventListener("mousedown",e=>{e.preventDefault();pickFont(f);});
    dd.appendChild(d);
  });
}
function pickFont(f){
  selectedFont=f;
  document.getElementById("font-search").value=f;
  closeFontDrop();
  ensureFont(f);
  const inp=document.getElementById("inline-input");
  if(inp.classList.contains("show")) inp.style.fontFamily=`'${f}',sans-serif`;
}
document.addEventListener("click",e=>{if(!e.target.closest(".font-search-wrap")) closeFontDrop();});

// ------------------------------------------------------------------ //
//  State                                                               //
// ------------------------------------------------------------------ //
let sessionId=null, pageCount=1, currentPage=0, fileName="";
let allSpans=[], allImages=[];
let activeSpan=null, activeImg=null;
const ZOOM=1.5;

// ------------------------------------------------------------------ //
//  UI helpers                                                          //
// ------------------------------------------------------------------ //
function showLoading(m){document.getElementById("loading-text").textContent=m||"Processing…";document.getElementById("loading").classList.add("show");}
function hideLoading(){document.getElementById("loading").classList.remove("show");}
function setStatus(m,warn){
  document.getElementById("status-pill").textContent=m;
  document.getElementById("sb-msg").textContent=m;
  document.getElementById("sb-dot").className="sb-dot"+(warn?" warn":"");
}
function setSbInfo(m){document.getElementById("sb-info").textContent=m;}

function scaleFactors(){
  const img=document.getElementById("pdf-img");
  return{sx:img.clientWidth/img.naturalWidth, sy:img.clientHeight/img.naturalHeight};
}
function screenToPdf(x,y){const{sx,sy}=scaleFactors();return{x:x/(ZOOM*sx),y:y/(ZOOM*sy)};}

// ------------------------------------------------------------------ //
//  Upload                                                              //
// ------------------------------------------------------------------ //
document.getElementById("file-input").addEventListener("change",e=>{if(e.target.files[0])uploadFile(e.target.files[0]);});
document.body.addEventListener("dragover",e=>{e.preventDefault();document.getElementById("drop-card").classList.add("drag-over");});
document.body.addEventListener("dragleave",()=>document.getElementById("drop-card").classList.remove("drag-over"));
document.body.addEventListener("drop",e=>{
  e.preventDefault();document.getElementById("drop-card").classList.remove("drag-over");
  const f=e.dataTransfer.files[0];if(f?.name.endsWith(".pdf"))uploadFile(f);
});

async function uploadFile(file){
  showLoading("Opening "+file.name+"…");
  fileName=file.name;
  const fd=new FormData();fd.append("file",file);
  try{
    const r=await fetch("/upload",{method:"POST",body:fd});
    const data=await r.json();
    if(!r.ok){alert(data.error||"Upload failed");hideLoading();return;}
    sessionId=data.session_id; pageCount=data.page_count; currentPage=0;
    document.getElementById("drop-zone").style.display="none";
    document.getElementById("viewer").classList.add("show");
    document.getElementById("page-nav").classList.add("show");
    document.getElementById("btn-download").disabled=false;
    document.getElementById("file-info").textContent=file.name;
    renderPage(data.page_image,data.spans,data.images||[]);
    setStatus("Click text to edit · Drag to reposition");
    setSbInfo(pageCount+" page"+(pageCount>1?"s":"")+" · "+Math.round(file.size/1024)+" KB");
    hideLoading();
  }catch(e){alert("Error: "+e.message);hideLoading();}
}

// ------------------------------------------------------------------ //
//  Render page                                                         //
// ------------------------------------------------------------------ //
function renderPage(b64,spans,images){
  deselect();
  const img=document.getElementById("pdf-img");
  img.src="data:image/png;base64,"+b64;
  allSpans=spans; allImages=images||[];
  img.onload=()=>drawBoxes();
  if(img.complete&&img.naturalWidth) drawBoxes();
  document.getElementById("page-label").textContent=`Page ${currentPage+1} of ${pageCount}`;
  document.getElementById("btn-prev").disabled=currentPage===0;
  document.getElementById("btn-next").disabled=currentPage===pageCount-1;
}

function drawBoxes(){
  document.querySelectorAll(".span-box,.img-box").forEach(el=>el.remove());
  const ov=document.getElementById("overlay");
  const{sx,sy}=scaleFactors();
  allSpans.forEach((span,idx)=>{
    const[x0,y0,x1,y1]=span.bbox;
    const d=document.createElement("div");d.className="span-box";d.dataset.idx=idx;
    d.style.cssText=`left:${x0*ZOOM*sx}px;top:${y0*ZOOM*sy}px;width:${(x1-x0)*ZOOM*sx}px;height:${(y1-y0)*ZOOM*sy}px;`;
    d.title=span.text;
    addInteraction(d,()=>selectSpan(idx),(dx,dy)=>moveSpan(idx,dx,dy));
    ov.appendChild(d);
  });
  allImages.forEach((img,idx)=>{
    const[x0,y0,x1,y1]=img.bbox;
    const d=document.createElement("div");d.className="img-box";d.dataset.idx=idx;
    d.style.cssText=`left:${x0*ZOOM*sx}px;top:${y0*ZOOM*sy}px;width:${(x1-x0)*ZOOM*sx}px;height:${(y1-y0)*ZOOM*sy}px;`;
    const badge=document.createElement("div");badge.className="img-badge";badge.textContent="IMAGE";
    d.appendChild(badge);
    addInteraction(d,()=>selectImage(idx),(dx,dy)=>moveImage(idx,dx,dy));
    ov.appendChild(d);
  });
  setSbInfo(`${pageCount} page${pageCount>1?"s":""} · ${allSpans.length} text spans · ${allImages.length} images`);
}
window.addEventListener("resize",()=>{if(allSpans.length||allImages.length)drawBoxes();});

// ------------------------------------------------------------------ //
//  Drag + click                                                        //
// ------------------------------------------------------------------ //
function addInteraction(el,onClickFn,onDragEndFn){
  let sx,sy,moved=false;
  const ghost=document.getElementById("drag-ghost");
  el.addEventListener("mousedown",e=>{
    e.stopPropagation();e.preventDefault();
    sx=e.clientX;sy=e.clientY;moved=false;
    const isImg=el.classList.contains("img-box");
    ghost.className="drag-ghost"+(isImg?" img":"");
    ghost.style.cssText=`left:${el.style.left};top:${el.style.top};width:${el.style.width};height:${el.style.height};`;
    function onMove(e2){
      const dx=e2.clientX-sx,dy=e2.clientY-sy;
      if(Math.abs(dx)>4||Math.abs(dy)>4){
        moved=true;
        ghost.style.left=(parseFloat(el.style.left)+dx)+"px";
        ghost.style.top=(parseFloat(el.style.top)+dy)+"px";
        ghost.style.display="block";
        el.classList.add("dragging");
      }
    }
    function onUp(e2){
      document.removeEventListener("mousemove",onMove);
      document.removeEventListener("mouseup",onUp);
      ghost.style.display="none";
      el.classList.remove("dragging");
      if(moved) onDragEndFn(e2.clientX-sx,e2.clientY-sy);
      else onClickFn();
    }
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });
}

// ------------------------------------------------------------------ //
//  Text: select + inline edit                                          //
// ------------------------------------------------------------------ //
function selectSpan(idx){
  deselect();
  activeSpan=allSpans[idx];
  document.querySelector(`.span-box[data-idx="${idx}"]`)?.classList.add("selected");
  const{sx,sy}=scaleFactors();
  const[x0,y0,x1,y1]=activeSpan.bbox;
  const pxLeft=x0*ZOOM*sx, pxTop=y0*ZOOM*sy;
  const pxW=Math.max((x1-x0)*ZOOM*sx,80), pxH=(y1-y0)*ZOOM*sy;
  const inp=document.getElementById("inline-input");
  inp.style.cssText=`left:${pxLeft}px;top:${pxTop}px;width:${pxW+24}px;height:${pxH}px;font-size:${activeSpan.size*ZOOM*sy}px;font-family:'${selectedFont||activeSpan.font}',sans-serif;`;
  inp.value=activeSpan.text;inp.classList.add("show");inp.focus();inp.select();
  document.getElementById("font-group").classList.add("show");
  document.getElementById("font-search").value=selectedFont||activeSpan.font;
  document.getElementById("size-label").textContent=activeSpan.size+" pt";
  showCtxBar(pxLeft,pxTop+pxH+6,[
    {cls:"ctx-apply",text:"✓ Apply",fn:applyTextEdit},
    {cls:"ctx-sep"},
    {cls:"ctx-cancel",text:"✗ Cancel",fn:deselect},
  ]);
  setStatus("Editing — Enter to apply, Esc to cancel");
}

async function applyTextEdit(){
  if(!activeSpan) return;
  const newText=document.getElementById("inline-input").value.trim();
  if(!newText){deselect();return;}
  setCtxStatus("Saving…");
  const body={session_id:sessionId,page:currentPage,bbox:activeSpan.bbox,new_text:newText,font:activeSpan.font};
  if(selectedFont) body.gfont=selectedFont;
  try{
    const r=await fetch("/edit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await r.json();
    if(data.success){
      setStatus(data.font_preserved?"Saved":"Saved (fallback font: "+data.font_used?.split("/").pop()+")",!data.font_preserved);
      renderPage(data.page_image,data.spans,data.images);
    }else{setStatus("Edit failed",true);deselect();}
  }catch(e){setStatus("Error: "+e.message,true);}
}

async function moveSpan(idx,dxPx,dyPx){
  const span=allSpans[idx];
  const p=screenToPdf(dxPx,dyPx);
  showLoading("Moving text…");
  try{
    const r=await fetch("/move",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session_id:sessionId,page:currentPage,bbox:span.bbox,new_x:span.bbox[0]+p.x,new_y:span.bbox[1]+p.y})});
    const data=await r.json();
    if(data.success) renderPage(data.page_image,data.spans,data.images);
  }catch(e){}
  hideLoading();
}

// ------------------------------------------------------------------ //
//  Image ops                                                           //
// ------------------------------------------------------------------ //
function selectImage(idx){
  deselect();
  activeImg=allImages[idx];
  const el=document.querySelector(`.img-box[data-idx="${idx}"]`);
  if(el){
    el.classList.add("selected");
    ["tl","tr","bl","br"].forEach(pos=>{
      const rh=document.createElement("div");
      rh.className=`rh rh-${pos}`;
      addResizeHandle(rh,el,idx,pos);
      el.appendChild(rh);
    });
  }
  const{sx,sy}=scaleFactors();
  const[x0,y0,x1,y1]=activeImg.bbox;
  const pxLeft=x0*ZOOM*sx, pxTop=y0*ZOOM*sy, pxH=(y1-y0)*ZOOM*sy;
  showCtxBar(pxLeft,pxTop+pxH+8,[
    {cls:"ctx-replace",text:"↺ Replace",fn:triggerReplace},
    {cls:"ctx-sep"},
    {cls:"ctx-delete",text:"🗑 Delete",fn:deleteImage},
    {cls:"ctx-sep"},
    {cls:"ctx-cancel",text:"✗",fn:deselect},
  ]);
  setStatus("Image selected · Drag to move · Corner handles to resize");
}

function addResizeHandle(rh,boxEl,idx,corner){
  let sx2,sy2,origBbox;
  rh.addEventListener("mousedown",e=>{
    e.stopPropagation();e.preventDefault();
    sx2=e.clientX;sy2=e.clientY;
    origBbox=[...allImages[idx].bbox];
    const{sx,sy}=scaleFactors();
    function calc(e2){
      const dxPdf=(e2.clientX-sx2)/(ZOOM*sx);
      const dyPdf=(e2.clientY-sy2)/(ZOOM*sy);
      let[nx0,ny0,nx1,ny1]=origBbox;
      if(corner==="tl"){nx0+=dxPdf;ny0+=dyPdf;}
      else if(corner==="tr"){nx1+=dxPdf;ny0+=dyPdf;}
      else if(corner==="bl"){nx0+=dxPdf;ny1+=dyPdf;}
      else{nx1+=dxPdf;ny1+=dyPdf;}
      if(nx1-nx0<20)nx1=nx0+20;
      if(ny1-ny0<20)ny1=ny0+20;
      return[nx0,ny0,nx1,ny1];
    }
    function onMove(e2){
      const[nx0,ny0,nx1,ny1]=calc(e2);
      const{sx,sy}=scaleFactors();
      boxEl.style.left=(nx0*ZOOM*sx)+"px";boxEl.style.top=(ny0*ZOOM*sy)+"px";
      boxEl.style.width=((nx1-nx0)*ZOOM*sx)+"px";boxEl.style.height=((ny1-ny0)*ZOOM*sy)+"px";
    }
    async function onUp(e2){
      document.removeEventListener("mousemove",onMove);
      document.removeEventListener("mouseup",onUp);
      const newBbox=calc(e2);
      showLoading("Resizing…");
      const fd=new FormData();
      fd.append("op","resize");fd.append("session_id",sessionId);
      fd.append("page",currentPage);fd.append("bbox",origBbox.join(","));
      fd.append("new_bbox",newBbox.join(","));
      try{
        const r=await fetch("/image_op",{method:"POST",body:fd});
        const data=await r.json();
        if(data.success) renderPage(data.page_image,data.spans,data.images);
      }catch(e){}
      hideLoading();
    }
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onUp);
  });
}

function triggerReplace(){document.getElementById("img-replace-input").click();}

document.getElementById("img-replace-input").addEventListener("change",async e=>{
  if(!e.target.files[0]||!activeImg) return;
  showLoading("Replacing image…");
  const fd=new FormData();
  fd.append("op","replace");fd.append("session_id",sessionId);
  fd.append("page",currentPage);fd.append("bbox",activeImg.bbox.join(","));
  fd.append("image",e.target.files[0]);
  try{
    const r=await fetch("/image_op",{method:"POST",body:fd});
    const data=await r.json();
    if(data.success) renderPage(data.page_image,data.spans,data.images);
  }catch(err){}
  e.target.value="";hideLoading();
});

async function deleteImage(){
  if(!activeImg) return;
  showLoading("Deleting…");
  const fd=new FormData();
  fd.append("op","delete");fd.append("session_id",sessionId);
  fd.append("page",currentPage);fd.append("bbox",activeImg.bbox.join(","));
  try{
    const r=await fetch("/image_op",{method:"POST",body:fd});
    const data=await r.json();
    if(data.success) renderPage(data.page_image,data.spans,data.images);
  }catch(e){}
  hideLoading();
}

async function moveImage(idx,dxPx,dyPx){
  const img=allImages[idx];
  const p=screenToPdf(dxPx,dyPx);
  const[x0,y0,x1,y1]=img.bbox;
  showLoading("Moving image…");
  const fd=new FormData();
  fd.append("op","resize");fd.append("session_id",sessionId);fd.append("page",currentPage);
  fd.append("bbox",[x0,y0,x1,y1].join(","));
  fd.append("new_bbox",[x0+p.x,y0+p.y,x1+p.x,y1+p.y].join(","));
  try{
    const r=await fetch("/image_op",{method:"POST",body:fd});
    const data=await r.json();
    if(data.success) renderPage(data.page_image,data.spans,data.images);
  }catch(e){}
  hideLoading();
}

// ------------------------------------------------------------------ //
//  Context bar                                                         //
// ------------------------------------------------------------------ //
function showCtxBar(left,top,items){
  const bar=document.getElementById("ctx-bar");
  bar.innerHTML="";
  items.forEach(({cls,text,fn})=>{
    if(cls==="ctx-sep"){const s=document.createElement("div");s.className="ctx-sep";bar.appendChild(s);return;}
    const b=document.createElement("button");b.className="ctx-btn "+cls;b.textContent=text;
    b.addEventListener("click",fn);bar.appendChild(b);
  });
  const stat=document.createElement("span");stat.id="ctx-status";bar.appendChild(stat);
  bar.style.left=left+"px";bar.style.top=top+"px";
  bar.classList.add("show");
}
function setCtxStatus(m){const s=document.getElementById("ctx-status");if(s)s.textContent=m;}

// ------------------------------------------------------------------ //
//  Deselect                                                            //
// ------------------------------------------------------------------ //
function deselect(){
  document.getElementById("inline-input").classList.remove("show");
  document.getElementById("ctx-bar").classList.remove("show");
  document.querySelectorAll(".span-box,.img-box").forEach(el=>{
    el.classList.remove("selected","dragging");
    el.querySelectorAll(".rh").forEach(r=>r.remove());
  });
  document.getElementById("font-group").classList.remove("show");
  activeSpan=null;activeImg=null;
}
document.getElementById("pdf-img").addEventListener("click",deselect);
document.getElementById("inline-input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();applyTextEdit();}
  if(e.key==="Escape") deselect();
});

// ------------------------------------------------------------------ //
//  Page nav + download                                                 //
// ------------------------------------------------------------------ //
async function changePage(delta){
  const next=currentPage+delta;
  if(next<0||next>=pageCount) return;
  showLoading("Loading page…");
  const r=await fetch(`/page/${sessionId}/${next}`);
  const data=await r.json();
  currentPage=next;
  renderPage(data.page_image,data.spans,data.images||[]);
  hideLoading();
}
function downloadPDF(){if(sessionId) window.location.href=`/download/${sessionId}`;}
</script>
